es simulados</p><div class="metrics"><div>Alcance<b>3,420</b></div><div>Interacciones<b>480</b></div><div>Conversiones<b>96</b></div></div><button class="secondary" onclick="go('Resultados')">Ver resultados</button></section><section><h3>◷ Historial de campañas</h3><p class="muted">Tus últimas solicitudes.</p>${state.history.slice(-3).reverse().map(c=>`<p>${c.name} <span class="tag">${c.status}</span></p>`).join('')||'<p>Sin campañas solicitadas.</p>'}<button class="secondary" onclick="go('Historial')">Ver historial</button></section></div>`;if(tab==='Alertas')b=`<h2>Alertas inteligentes</h2>${a.map(x=>`<div class="card"><h3>${x.title}</h3><p>${esc(x.desc)}</p>${campaign(catalog.find(c=>c.id===x.id))}</div>`).join('')||'<p>No hay alertas.</p>'}<button onclick="go('Mi negocio')">Actualizar datos comerciales</button>`;if(tab==='Ayuda')b=`<h2>Centro de ayuda</h2><div class="card"><p>Registra tus ventas e inventario en Mi negocio. Revisa las alertas, activa campañas y consulta tus créditos e historial.</p><p>Demostración académica: no publica anuncios reales ni procesa pagos.</p></div>`;if(tab==='Mi negocio')b=`<h2>Información comercial</h2><form class="card" onsubmit="save(event)"><label>Producto</label><input id="name" required value="${esc(d.name)}">${[['stock','Unidades disponibles'],['threshold','Límite deseado de inventario'],['sales','Ventas del periodo'],['target','Meta de ventas'],['clients','Clientes pendientes de reactivación']].map(([k,l])=>`<label for="${k}">${l}</label><input id="${k}" type="number" min="0" step="1" required value="${d[k]}">`).join('')}<p><button>Guardar y generar alertas</button></p></form>`;if(tab==='Campañas')b=`<h2>Catálogo de campañas</h2><p>Créditos disponibles: ${state.balance}</p><div class="grid">${catalog.map(campaign).join('')}</div>`;if(tab==='Créditos')b=`<h2>Mi suscripción</h2><div class="card"><h3>Plan Acción 360 · S/250 al mes</h3><div class="grid">${tile('Disponibles',state.balance)}${tile('Utilizados',12-state.balance)}</div><div class="bar"><i style="width:${(12-state.balance)/12*100}%"></i></div><p>Precio y asignación referenciales.</p></div>`;if(tab==='Resultados')b=`<h2>Seguimiento de resultados</h2><p class="muted">Indicadores comerciales ilustrativos, no mediciones reales.</p><div class="grid">${tile('Alcance','3,420')}${tile('Interacciones',480)}${tile('Conversiones',96)}</div><div class="card"><h3>Actividad de la demostración</h3><p>Campañas solicitadas: ${active}</p><p>Créditos utilizados: ${12-state.balance}</p><p>Alertas detectadas: ${a.length}</p></div>`;if(tab==='Historial')b=`<h2>Historial</h2>${state.history.map((c,i)=>`<div class="card"><h3>${c.name}</h3><p>${c.cost} créditos · ${c.status}</p>${c.status==='Solicitada'?`<button class="secondary" onclick="cancel(${i})">Cancelar solicitud</button>`:''}</div>`).join('')||'<p>No hay campañas solicitadas.</p>'}`;document.getElementById('main').innerHTML=(notice?`<div class="notice" role="status">${notice}</div>`:'')+b}function save(e){e.preventDefault();state.data.name=document.getElementById('name').value.trim()||'Producto';for(let k of ['stock','threshold','sales','target','clients'])state.data[k]=Number(document.getElementById(k).value);persist();tab='Inicio';notice='Datos actualizados. Alertas generadas.';render()}function reset(){state=structuredClone(initial);persist();go('Inicio')}render();</script></body></html>
